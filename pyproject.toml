[project]
name = "unraid-ssh-mcp"
version = "0.1.0"
description = "Guardrailed MCP server for Unraid management via SSH"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "fastmcp>=2.0.0",
    "paramiko>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
unraid-ssh-mcp = "unraid_ssh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unraid_ssh_mcp"]
